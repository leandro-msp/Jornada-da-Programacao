<!DOCTYPE html> <!-- declara o tipo de documento e indica para o navegador interpretar 
com a versão mais recente do HTML-->

<html lang="pt-br"> <!-- tag de abertura, define o início do conteúdo html, todo o conteúdo da página 
    deve ficar entre abertura e fechamento dessa tag
    
junto á tag de abertura há o attributo "lang": 
é importante para que os
navegadores, sistemas de busca, leitores de tela e outros
sistemas possam detectar corretamente o idioma que a
página foi escrita.
-->

<head> <!-- tag que define a "cabeça" da página.
            Contêiner de metadados e informações de configuração de uma página web
            as informações contidas aqui são do interesse do próprio navegador, 
            e não serão exibidas para o usuário final-->

    <meta charset="UTF-8"> <!-- tag que configura a codificação de idioma que queremos utilizar
    em nossa página, com objetivo de interpretar carcateres específicos de um idioma, por exemplo,
    o pt-br, que possui acentos e cedilha.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <!-- Título da Aba no navegador-->
</head>

<body>
    <!--Corpo, aqui é inserido todo o conteúdo que vai compor a página 
    Sendo todo conteúdo visível e interativo de uma página web, e será visualizado pelo usuário, como:
        textos, imagens, vídeos, links, tabelas e formulários
        
        dentro desta tag também é possível fazer a integração com outras linguagens que possui compatibilidade
        com o html, ex.: PHP, JAVASCRIPT, e o CSS
        -->
    
</body>
</html> <!--Fechamento da tag-->

<!--TAG DE ABERTURA E TAG DE FECHAMENTO:
        Abertura: Indica/marca o início do elemento, podendo receber atributos, para se abrir uma tag
        se utilza os sinais de maior menor e maior " < > ".

        Fechamento: A tag de fechamento indica o fim de elemento, e esta não pode receber atributos
        para fechar uma tag se utiliza uma barra dentro da dos sinais de menor  maior " </>"

        exemplo de abre e fecha tag: <body> </body>
-->
