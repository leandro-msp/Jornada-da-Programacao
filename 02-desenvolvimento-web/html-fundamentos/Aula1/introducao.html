<!DOCTYPE html> <!-- declara o tipo de documento e qual versão do HTML o navegador irá interpretar-->
<html lang="pt-br"> <!--A linguagem que o browser vai interpretar na leitura de textos-->


<head> <!-- Contêiner de metadados e informações de configuração de uma página web-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução HTML</title>
</head>

<body>
    <!--Corpo, aqui é inserido todo o conteúdo que vai compor a página 
    Sendo todo conteúdo visível e interativo de uma página web, como:
        textos, imagens, vídeos, links, tabelas e formulários-->
    <h1>Página Inicial</h1>
    <p>Aula 1 - 21/08/2026</p>
    
    
</body>
</html> <!--Fechamento da tag-->

<!--TAG DE ABERTURA E TAG DE FECHAMENTO:
        Abertura: Indica/marca o início do elemento, podendo receber atributos, para se abrir uma tag
        se utilza os sinais de maior menor e maior " <> ".

        Fechamento: A tag de fechamento indica o fim de elemento, e esta não pode receber atributos
        para fechar uma tag se utiliza uma barra dentro da dos sinais de menor  maior " </>"

        exemplo de abre e fecha tag: <body> </body>s
-->
